<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#004d61"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Academic Literature Document -->
  <g transform="translate(110, 85)">
    <!-- Document background -->
    <path d="M 30,0 L 190,0 C 205,0 215,10 215,25 L 215,310 C 215,325 205,335 190,335 L 30,335 C 15,335 5,325 5,310 L 5,25 C 5,10 15,0 30,0 Z" 
          fill="#1e3a5f" stroke="#325d88" stroke-width="4" opacity="0.9"/>
    
    <!-- Document fold / lines -->
    <rect x="35" y="40" width="90" height="12" rx="6" fill="url(#goldGrad)"/>
    <rect x="35" y="70" width="145" height="8" rx="4" fill="#64ffda" opacity="0.8"/>
    <rect x="35" y="95" width="130" height="8" rx="4" fill="#8892b0" opacity="0.6"/>
    <rect x="35" y="120" width="140" height="8" rx="4" fill="#8892b0" opacity="0.6"/>
    <rect x="35" y="145" width="110" height="8" rx="4" fill="#8892b0" opacity="0.6"/>

    <!-- Medical Cross Badge on Document -->
    <circle cx="160" cy="50" r="18" fill="url(#accentGrad)" filter="url(#glow)"/>
    <rect x="156" y="40" width="8" height="20" rx="2" fill="#0a192f"/>
    <rect x="150" y="46" width="20" height="8" rx="2" fill="#0a192f"/>
  </g>

  <!-- Magnifying Glass / Search Scope -->
  <g transform="translate(190, 160)">
    <!-- Glass Rim -->
    <circle cx="140" cy="140" r="95" fill="#0a192f" fill-opacity="0.75" stroke="url(#accentGrad)" stroke-width="14" filter="url(#glow)"/>
    
    <!-- Subtle Inner Grid / Evidence Target -->
    <circle cx="140" cy="140" r="70" fill="none" stroke="#64ffda" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
    <circle cx="140" cy="140" r="45" fill="none" stroke="#64ffda" stroke-width="2" opacity="0.7"/>

    <!-- DNA Helix / Evidence Core inside lens -->
    <path d="M 115,115 Q 140,140 165,115" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 115,140 Q 140,165 165,140" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 115,165 Q 140,140 165,165" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="125" y1="126" x2="155" y2="126" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
    <line x1="125" y1="154" x2="155" y2="154" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>

    <!-- Handle -->
    <path d="M 210,210 L 290,290" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 235,235 L 285,285" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Stars / Quality Badges (Top-Tier Symbol) -->
  <polygon points="415,85 423,101 441,103 428,116 431,134 415,125 399,134 402,116 389,103 407,101" fill="url(#goldGrad)"/>
  <polygon points="105,375 110,387 123,388 113,398 116,411 105,404 94,411 97,398 87,388 100,387" fill="url(#goldGrad)" transform="scale(0.8) translate(30, 20)"/>
</svg>
